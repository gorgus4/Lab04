<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>

<h1>Power Calculator</h1>

<form id="deviceForm" action="/lightbulb" method="POST">
    <div>
        <label for="type">Device type:</label>
        <select id="type" onchange="changeLink(this.value)" required>
            <option value="lightbulb">lightbulb</option>
            <option value="engine">engine</option>
            <option value="heater">heater</option>
        </select>
    </div>

    <br>

    <div>
        <label for="voltage">Voltage (V):</label>
        <input type="number" step="0.1" name="voltage" id="voltage" placeholder="e.g. 230" required>
    </div>

    <div>
        <label for="current">Current (A):</label>
        <input type="number" step="0.1" name="current" id="current" placeholder="e.g. 5" required>
    </div>

    <br>

    <button type="submit">Calculate power</button>

</form>

<br><br>
<a href="/list"><button>Show List</button></a>

<script>
    function changeLink(chosenType) {
        document.getElementById("deviceForm").action = "/" + chosenType;
    }
</script>

</body>
</html>
